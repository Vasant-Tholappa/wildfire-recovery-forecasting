[project]
name = "wildfire-recovery-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vasant", email = "vasant.tholappa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.7.40",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyproj>=3.7.2",
    "rasterio>=1.5.1",
    "shapely>=2.1.2",
]

[project.scripts]
wildfire-recovery-forecasting = "wildfire_recovery_forecasting:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
