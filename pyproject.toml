[project]
name = "wildfire-recovery-forecasting"
version = "0.1.0"
description = "Predicting fifth-season post-fire Landsat NBR across the Western U.S."
readme = "README.md"
authors = [
    { name = "vasant", email = "vasant.tholappa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.7.40",
    "geemap>=0.38.3",
    "geopandas>=1.1.4",
    "google-cloud-storage>=3.13.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mlflow>=3.17.2",
    "numpy>=2.5.2",
    "optuna>=5.0.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyproj>=3.7.2",
    "rasterio>=1.5.1",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "shapely>=2.1.2",
    "torch>=2.15.0",
    "xgboost>=3.4.1",
]

[project.scripts]
wildfire-recovery-forecasting = "wildfire_recovery_forecasting:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
